<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>釜山 × 福岡 旅遊手帳</title>
<meta name="theme-color" content="#cfeaf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅遊手帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Huninn&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 共用手繪濾鏡與圖示 -->
<svg class="defs" width="0" height="0" aria-hidden="true">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3.2"/>
    </filter>
  </defs>
  <symbol id="i-ramen" viewBox="0 0 64 64">
    <g filter="url(#rough)" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 10 q4 6 0 12 M24 8 q4 6 0 12 M34 10 q4 6 0 12" fill="none"/>
      <path d="M40 4 L22 30 M50 6 L30 30" fill="none"/>
      <path d="M6 30 H58 A26 22 0 0 1 6 30 Z" fill="var(--red)"/>
      <path d="M14 38 h36" fill="none" stroke-dasharray="4 5"/>
    </g>
  </symbol>
  <symbol id="i-fishcake" viewBox="0 0 64 64">
    <g filter="url(#rough)" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 2 V62" fill="none"/>
      <path d="M18 12 q14 -6 28 0 q-10 6 0 12 q-14 6 -28 0 q10 -6 0 -12 Z" fill="var(--yellow)"/>
      <path d="M18 30 q14 -6 28 0 q-10 6 0 12 q-14 6 -28 0 q10 -6 0 -12 Z" fill="var(--yellow)"/>
    </g>
  </symbol>
  <symbol id="i-torii" viewBox="0 0 64 64">
    <g filter="url(#rough)" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12 q28 -8 56 0 l-2 7 q-26 -6 -52 0 Z" fill="var(--red)"/>
      <rect x="10" y="24" width="44" height="6" fill="var(--red)"/>
      <path d="M16 18 L14 60 h7 L22 18 M48 18 L50 60 h-7 L42 18" fill="var(--red)"/>
    </g>
  </symbol>
  <symbol id="i-starfish" viewBox="0 0 64 64">
    <g filter="url(#rough)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round">
      <path d="M32 4 L39 24 L60 24 L43 37 L50 58 L32 45 L14 58 L21 37 L4 24 L25 24 Z" fill="var(--coral)"/>
      <circle cx="32" cy="30" r="2" fill="var(--ink)"/>
    </g>
  </symbol>
  <symbol id="i-suitcase" viewBox="0 0 64 64">
    <g filter="url(#rough)" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 14 V8 h16 v6" fill="none"/>
      <rect x="8" y="14" width="48" height="40" rx="6" fill="var(--sea)"/>
      <circle cx="22" cy="30" r="6" fill="var(--yellow)"/>
      <rect x="34" y="36" width="14" height="10" rx="2" fill="var(--coral)"/>
      <path d="M16 58 v2 M48 58 v2" fill="none"/>
    </g>
  </symbol>
  <symbol id="i-camera" viewBox="0 0 64 64">
    <g filter="url(#rough)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round">
      <path d="M8 20 h12 l5 -7 h14 l5 7 h12 v32 h-48 Z" fill="var(--mint)"/>
      <circle cx="32" cy="35" r="10" fill="var(--card)"/>
      <circle cx="32" cy="35" r="4" fill="var(--ink)"/>
    </g>
  </symbol>
  <symbol id="i-umbrella" viewBox="0 0 64 64">
    <g filter="url(#rough)" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 30 Q32 -6 60 30 q-7 -5 -14 0 q-7 -5 -14 0 q-7 -5 -14 0 q-7 -5 -14 0 Z" fill="var(--coral)"/>
      <path d="M32 30 V58 q0 4 -5 4" fill="none"/>
    </g>
  </symbol>
</svg>

<!-- 背景塗鴉 -->
<div class="doodles" aria-hidden="true">
  <svg class="d1"><use href="#i-ramen"/></svg>
  <svg class="d2"><use href="#i-starfish"/></svg>
  <svg class="d3"><use href="#i-torii"/></svg>
  <svg class="d4"><use href="#i-fishcake"/></svg>
  <svg class="d5"><use href="#i-umbrella"/></svg>
  <svg class="d6"><use href="#i-camera"/></svg>
</div>

<header class="hero">
  <svg class="hero-art" viewBox="0 0 800 220" aria-hidden="true">
    <rect class="sky" x="0" y="0" width="800" height="220"/>
    <g stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- 太陽 / 月亮 -->
      <g class="sun" filter="url(#rough)">
        <g class="rays" fill="none">
          <path d="M400 14 v-8 M400 96 v8 M359 55 h-8 M441 55 h8 M371 26 l-6 -6 M429 26 l6 -6 M371 84 l-6 6 M429 84 l6 6"/>
        </g>
        <circle cx="400" cy="55" r="26" fill="var(--sun)"/>
        <path class="face" d="M391 52 v2 M409 52 v2 M393 62 q7 6 14 0" fill="none"/>
      </g>

      <!-- 雲 -->
      <g class="cloud c1" filter="url(#rough)"><path d="M70 72 a14 14 0 0 1 20 -16 a20 20 0 0 1 38 2 a13 13 0 0 1 12 14 Z" fill="var(--cloud)"/></g>
      <g class="cloud c2" filter="url(#rough)"><path d="M560 50 a12 12 0 0 1 18 -13 a17 17 0 0 1 32 2 a11 11 0 0 1 10 11 Z" fill="var(--cloud)"/></g>
      <g class="cloud c3" filter="url(#rough)"><path d="M250 34 a10 10 0 0 1 15 -10 a14 14 0 0 1 26 2 a9 9 0 0 1 8 8 Z" fill="var(--cloud)"/></g>

      <!-- 海鷗 -->
      <g class="gull g1" fill="none"><path d="M300 80 q6 -7 12 0 q6 -7 12 0"/></g>
      <g class="gull g2" fill="none"><path d="M330 98 q5 -6 10 0 q5 -6 10 0"/></g>
      <g class="gull g3" fill="none"><path d="M500 88 q5 -6 10 0 q5 -6 10 0"/></g>

      <!-- 飛機 -->
      <g class="plane">
        <path d="M-60 40 h-60" fill="none" stroke-dasharray="6 8" stroke-width="2.5"/>
        <g filter="url(#rough)">
          <path d="M-50 40 q4 -8 40 -6 q14 1 16 6 q-2 5 -16 6 q-36 2 -40 -6 Z" fill="var(--card)"/>
          <path d="M-30 37 l-8 -16 h8 l14 16 M-30 43 l-8 14 h8 l14 -14 M-48 38 l-6 -12 h6 l8 12" fill="var(--coral)"/>
          <path d="M-4 37 h4 M-12 37 h4" fill="none"/>
        </g>
      </g>

      <!-- 釜山：甘川洞山丘 -->
      <g filter="url(#rough)">
        <path d="M-10 172 Q50 92 140 112 Q205 124 240 172 Z" fill="var(--hill)"/>
        <rect x="36" y="140" width="20" height="16" fill="var(--coral)"/>
        <rect x="60" y="124" width="18" height="16" fill="var(--yellow)"/>
        <rect x="82" y="112" width="20" height="18" fill="var(--sea)"/>
        <rect x="108" y="116" width="18" height="16" fill="var(--mint)"/>
        <rect x="132" y="124" width="20" height="16" fill="var(--coral)"/>
        <rect x="66" y="146" width="20" height="16" fill="var(--mint)"/>
        <rect x="92" y="138" width="20" height="18" fill="var(--yellow)"/>
        <rect x="118" y="142" width="18" height="16" fill="var(--sea)"/>
        <rect x="144" y="146" width="20" height="16" fill="var(--yellow)"/>
        <rect x="170" y="148" width="18" height="16" fill="var(--coral)"/>
        <path d="M44 146 h4 M68 130 h4 M90 118 h4 M114 122 h4 M140 130 h4 M74 152 h4 M100 144 h4 M150 152 h4" fill="none"/>
      </g>
      <!-- 釜山：廣安大橋 -->
      <g filter="url(#rough)" fill="none">
        <path d="M196 160 H340"/>
        <path d="M228 160 V104 M308 160 V104"/>
        <path d="M196 156 Q214 126 228 106 Q268 158 308 106 Q322 126 340 156"/>
        <path d="M244 130 V160 M258 141 V160 M278 141 V160 M292 130 V160 M212 138 V160 M324 138 V160" stroke-width="2"/>
      </g>
      <g class="lights">
        <circle cx="228" cy="104" r="3"/><circle cx="308" cy="104" r="3"/>
        <circle cx="268" cy="150" r="2.5"/>
      </g>

      <!-- 福岡：屋台 -->
      <g filter="url(#rough)">
        <path class="steam" d="M584 108 q-5 -8 0 -16 q5 -8 0 -16 M600 106 q-5 -8 0 -16 q5 -8 0 -16" fill="none"/>
        <rect x="560" y="136" width="84" height="34" fill="var(--wood)"/>
        <path d="M552 136 H652 L642 116 H562 Z" fill="var(--red)"/>
        <path d="M566 136 v14 h12 v-14 M584 136 v14 h12 v-14 M602 136 v14 h12 v-14 M620 136 v14 h12 v-14" fill="var(--card)"/>
        <circle cx="574" cy="176" r="5" fill="var(--wood)"/><circle cx="630" cy="176" r="5" fill="var(--wood)"/>
        <path d="M660 116 v6" fill="none"/>
        <ellipse class="lantern" cx="660" cy="132" rx="9" ry="11" fill="var(--red)"/>
      </g>
      <!-- 福岡塔 -->
      <g filter="url(#rough)">
        <path d="M712 24 V44" fill="none"/>
        <path d="M702 172 L707 44 H717 L722 172 Z" fill="var(--glass)"/>
        <path d="M708 70 h8 M707 90 h10 M706 110 h12 M705 130 h14 M704 150 h16" fill="none" stroke-width="2"/>
        <rect x="701" y="56" width="22" height="12" rx="3" fill="var(--sea)"/>
      </g>

      <!-- 海 -->
      <path class="waves" d="M-100 170 q25 -8 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V230 H-100 Z" fill="var(--sea)"/>
      <path class="waves w2" d="M-100 192 q25 -6 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="var(--foam)" stroke-width="2.5"/>

      <!-- 渡輪 -->
      <g transform="translate(400 156)">
        <g class="ferry" filter="url(#rough)">
          <path d="M-14 -22 h8 v10 h-8 Z" fill="var(--coral)"/>
          <rect x="-24" y="-12" width="40" height="12" fill="var(--card)"/>
          <path d="M-18 -6 h4 M-8 -6 h4 M2 -6 h4" fill="none"/>
          <path d="M-40 0 H40 L30 16 H-32 Z" fill="var(--card)"/>
          <path d="M-36 7 H36" fill="none" stroke="var(--sea-deep)" stroke-width="3"/>
        </g>
      </g>
    </g>
    <text x="70" y="212" class="hero-label">BUSAN 釜山</text>
    <text x="600" y="212" class="hero-label">FUKUOKA 福岡</text>
  </svg>

  <div class="hero-bar">
    <div class="trip-picker">
      <select id="tripSelect" aria-label="選擇旅程"></select>
      <button class="ghost round" id="newTripBtn" title="新增旅程">＋</button>
    </div>
    <div class="trip-meta" id="tripMeta"></div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="live" class="active"><span>🧭</span>即時</button>
  <button data-tab="prep"><span>🧳</span>前置</button>
  <button data-tab="plan"><span>🗺️</span>行程</button>
  <button data-tab="money"><span>👛</span>記帳</button>
  <button data-tab="settle"><span>🧾</span>結算</button>
  <button data-tab="settings"><span>⚙️</span>設定</button>
</nav>

<main>
  <!-- 即時行程 -->
  <section id="tab-live" class="tab active">
    <div class="clock" id="clock"></div>
    <div id="liveBox"></div>
    <h3>今日行程</h3>
    <div id="todayList"></div>
  </section>

  <!-- 前置作業 -->
  <section id="tab-prep" class="tab">
    <div class="progress"><div id="prepBar"></div></div>
    <p class="muted" id="prepStat"></p>
    <form id="prepForm" class="row-form card">
      <input name="text" placeholder="待辦事項，例如：訂渡輪、換韓元日幣" required>
      <select name="cat">
        <option>交通</option><option>住宿</option><option>證件</option>
        <option>行李</option><option>票券</option><option>網路</option><option>其他</option>
      </select>
      <select name="owner" class="member-select"></select>
      <input name="due" type="date" title="期限">
      <button>新增</button>
    </form>
    <div id="prepList"></div>
  </section>

  <!-- 行程安排 -->
  <section id="tab-plan" class="tab">
    <form id="planForm" class="row-form card">
      <select name="city" title="城市">
        <option value="busan">🇰🇷 釜山</option>
        <option value="fukuoka">🇯🇵 福岡</option>
        <option value="move">⛴️ 移動</option>
        <option value="">📍 其他</option>
      </select>
      <input name="date" type="date" required>
      <input name="start" type="time" required>
      <input name="end" type="time">
      <input name="title" placeholder="行程名稱" required>
      <input name="place" placeholder="地點（可開地圖）">
      <input name="note" placeholder="備註 / 訂位代號">
      <input type="hidden" name="id">
      <button>儲存</button>
    </form>
    <div id="planList"></div>
  </section>

  <!-- 記帳 -->
  <section id="tab-money" class="tab">
    <form id="moneyForm" class="card form-grid">
      <label>類型
        <select name="type"><option value="expense">支出</option><option value="income">收入 / 退款</option></select>
      </label>
      <label>日期<input name="date" type="date" required></label>
      <label>項目<input name="title" placeholder="例如：一蘭拉麵、豬肉湯飯" required></label>
      <label>分類
        <select name="cat">
          <option>餐飲</option><option>交通</option><option>住宿</option><option>門票</option>
          <option>購物</option><option>前置費用</option><option>其他</option>
        </select>
      </label>
      <label>金額<input name="amount" type="number" step="0.01" min="0" required></label>
      <label>付款 / 收款人<select name="payer" class="member-select" required></select></label>
      <div class="full">
        <span class="lbl">分攤成員</span>
        <div id="splitBox" class="chips"></div>
      </div>
      <input type="hidden" name="id">
      <div class="full actions">
        <button>儲存</button>
        <button type="button" class="ghost" id="moneyReset">清除</button>
      </div>
    </form>
    <div class="filter">
      <select id="moneyFilter"><option value="">全部分類</option></select>
    </div>
    <div id="moneyList"></div>
  </section>

  <!-- 結算 -->
  <section id="tab-settle" class="tab">
    <div class="stats" id="settleStats"></div>
    <h3>每人費用</h3>
    <div id="personTable"></div>
    <h3>建議轉帳</h3>
    <div id="transfers"></div>
    <h3>分類統計</h3>
    <div id="catTable"></div>
    <h3>每日支出</h3>
    <div id="dayTable"></div>
  </section>

  <!-- 設定 -->
  <section id="tab-settings" class="tab">
    <form id="tripForm" class="card form-grid">
      <label>旅程名稱<input name="name" required></label>
      <label>幣別<input name="currency" placeholder="TWD / KRW / JPY"></label>
      <label>出發日<input name="start" type="date"></label>
      <label>回程日<input name="end" type="date"></label>
      <label>預算<input name="budget" type="number" min="0"></label>
      <div class="full actions"><button>儲存旅程設定</button></div>
    </form>

    <h3>成員</h3>
    <form id="memberForm" class="row-form">
      <input name="name" placeholder="成員名字" required>
      <button>新增成員</button>
    </form>
    <div id="memberList" class="chips"></div>

    <h3>資料</h3>
    <div class="actions">
      <button class="ghost" id="exportBtn">匯出 JSON</button>
      <label class="ghost btn">匯入 JSON<input type="file" id="importFile" accept=".json" hidden></label>
      <button class="danger" id="deleteTripBtn">刪除此旅程</button>
    </div>
  </section>
</main>

<footer class="foot">✈️ 釜山 ⇄ 福岡 ⛴️　祝旅途愉快！</footer>

<script src="app.js"></script>
</body>
</html>
